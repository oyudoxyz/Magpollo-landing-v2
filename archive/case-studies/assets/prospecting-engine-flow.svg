<svg viewBox="0 0 800 372" xmlns="http://www.w3.org/2000/svg" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8C867D"/>
    </marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#CE4257"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <!-- 01 SOURCE -->
  <rect x="24" y="28" width="232" height="112" rx="8" fill="#FAF8F5" stroke="#ACA69E" stroke-opacity="0.5"/>
  <text x="42" y="52" font-family="'JetBrains Mono', Menlo, monospace" font-size="10" fill="#CE4257" font-weight="600">01</text>
  <text x="42" y="72" font-size="14" font-weight="600" fill="#251F17">Source</text>
  <text x="42" y="92" font-size="11" fill="#635D53">4 public-data feeds on cron</text>
  <text x="42" y="108" font-size="11" fill="#635D53">+ CRM-recycle parsing, field notes</text>
  <text x="42" y="124" font-size="11" fill="#635D53">$0 to $0.05 per run</text>

  <!-- 02 SCORE -->
  <rect x="284" y="28" width="232" height="112" rx="8" fill="#FAF8F5" stroke="#ACA69E" stroke-opacity="0.5"/>
  <text x="302" y="52" font-family="'JetBrains Mono', Menlo, monospace" font-size="10" fill="#CE4257" font-weight="600">02</text>
  <text x="302" y="72" font-size="14" font-weight="600" fill="#251F17">Score</text>
  <text x="302" y="92" font-size="11" fill="#635D53">LLM extract, dedupe, 0-100 vs ICP</text>
  <text x="302" y="108" font-size="11" fill="#635D53">72-ZIP territory fence</text>
  <text x="302" y="124" font-size="11" fill="#635D53">hard-kills: gov, chains, franchises</text>

  <!-- 03 ENRICH -->
  <rect x="544" y="28" width="232" height="112" rx="8" fill="#FAF8F5" stroke="#ACA69E" stroke-opacity="0.5"/>
  <text x="562" y="52" font-family="'JetBrains Mono', Menlo, monospace" font-size="10" fill="#CE4257" font-weight="600">03</text>
  <text x="562" y="72" font-size="14" font-weight="600" fill="#251F17">Enrich</text>
  <text x="562" y="92" font-size="11" fill="#635D53">on-demand only, never bulk</text>
  <text x="562" y="108" font-size="11" fill="#635D53">AI website finder &#8594; contact data</text>
  <text x="562" y="124" font-size="11" fill="#635D53">reads the processor off the site</text>

  <!-- Row 1 arrows -->
  <line x1="256" y1="84" x2="280" y2="84" stroke="#8C867D" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="516" y1="84" x2="540" y2="84" stroke="#8C867D" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Wrap arrow: ENRICH down to DRAFT -->
  <path d="M 660 140 L 660 166 L 140 166 L 140 188" fill="none" stroke="#8C867D" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Row 2 -->
  <!-- 04 DRAFT -->
  <rect x="24" y="196" width="232" height="112" rx="8" fill="#FAF8F5" stroke="#ACA69E" stroke-opacity="0.5"/>
  <text x="42" y="220" font-family="'JetBrains Mono', Menlo, monospace" font-size="10" fill="#CE4257" font-weight="600">04</text>
  <text x="42" y="240" font-size="14" font-weight="600" fill="#251F17">Draft</text>
  <text x="42" y="260" font-size="11" fill="#635D53">AI in the rep's approved voice</text>
  <text x="42" y="276" font-size="11" fill="#635D53">guardrails in prompt + post-process</text>
  <text x="42" y="292" font-size="11" fill="#635D53">email + SMS variants per lead</text>

  <!-- 05 APPROVE (human gate) -->
  <rect x="284" y="196" width="232" height="112" rx="8" fill="#FAF0F2" stroke="#CE4257" stroke-width="1.5"/>
  <text x="302" y="220" font-family="'JetBrains Mono', Menlo, monospace" font-size="10" fill="#CE4257" font-weight="600">05</text>
  <text x="436" y="220" font-family="'JetBrains Mono', Menlo, monospace" font-size="9" fill="#CE4257" font-weight="600" letter-spacing="0.08em">HUMAN GATE</text>
  <text x="302" y="240" font-size="14" font-weight="600" fill="#251F17">Approve</text>
  <text x="302" y="260" font-size="11" fill="#635D53">every send waits here</text>
  <text x="302" y="276" font-size="11" fill="#635D53">edit, approve, reject in the app</text>
  <text x="302" y="292" font-size="11" fill="#CE4257" font-weight="600">nothing auto-sends, ever</text>

  <!-- 06 SEND + FOLLOW UP -->
  <rect x="544" y="196" width="232" height="112" rx="8" fill="#FAF8F5" stroke="#ACA69E" stroke-opacity="0.5"/>
  <text x="562" y="220" font-family="'JetBrains Mono', Menlo, monospace" font-size="10" fill="#CE4257" font-weight="600">06</text>
  <text x="562" y="240" font-size="14" font-weight="600" fill="#251F17">Send + follow up</text>
  <text x="562" y="260" font-size="11" fill="#635D53">email auto &#183; SMS one-click</text>
  <text x="562" y="276" font-size="11" fill="#635D53">day-3 + day-9 touches, threaded</text>
  <text x="562" y="292" font-size="11" fill="#635D53">reply = instant stop</text>

  <!-- Row 2 arrows -->
  <line x1="256" y1="252" x2="280" y2="252" stroke="#CE4257" stroke-width="1.5" marker-end="url(#arrAccent)"/>
  <line x1="516" y1="252" x2="540" y2="252" stroke="#CE4257" stroke-width="1.5" marker-end="url(#arrAccent)"/>

  <!-- Footer note -->
  <text x="400" y="348" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="10.5" fill="#635D53">A reply on any channel stops the sequence instantly. No reply after touch 3 &#8594; nurture, logged.</text>
</svg>
