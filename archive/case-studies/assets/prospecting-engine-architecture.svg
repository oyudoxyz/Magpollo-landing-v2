<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8C867D"/>
    </marker>
  </defs>

  <!-- The rep's machine -->
  <rect x="24" y="36" width="368" height="358" rx="8" fill="#FAF8F5" stroke="#ACA69E" stroke-width="1.5"/>
  <text x="44" y="64" font-family="'JetBrains Mono', Menlo, monospace" font-size="10" fill="#CE4257" font-weight="600" letter-spacing="0.1em">THE REP'S MACHINE &#183; LOCAL-FIRST</text>

  <rect x="44" y="80" width="328" height="78" rx="6" fill="#FFFFFF" stroke="#ACA69E" stroke-opacity="0.4"/>
  <text x="62" y="110" font-size="13.5" font-weight="600" fill="#251F17">Command-center app</text>
  <text x="62" y="130" font-size="11" fill="#635D53">signals &#183; outreach console &#183; pipeline &#183; AI chat</text>

  <line x1="208" y1="158" x2="208" y2="172" stroke="#8C867D" stroke-width="1.2"/>

  <rect x="44" y="172" width="328" height="78" rx="6" fill="#FFFFFF" stroke="#ACA69E" stroke-opacity="0.4"/>
  <text x="62" y="202" font-size="13.5" font-weight="600" fill="#251F17">Engine loop: every 3 minutes</text>
  <text x="62" y="222" font-size="11" fill="#635D53">drain jobs &#183; scan replies &#183; advance follow-ups &#183; mirror</text>

  <line x1="208" y1="250" x2="208" y2="264" stroke="#8C867D" stroke-width="1.2"/>

  <rect x="44" y="264" width="328" height="78" rx="6" fill="#FFFFFF" stroke="#ACA69E" stroke-opacity="0.4"/>
  <text x="62" y="294" font-size="13.5" font-weight="600" fill="#251F17">PostgreSQL: single source of truth</text>
  <text x="62" y="314" font-size="11" fill="#635D53">every lead, touch, draft, reply, and wave in one DB</text>

  <text x="44" y="372" font-size="10.5" font-family="'JetBrains Mono', Menlo, monospace" fill="#635D53">never exposed to the internet</text>

  <!-- External: public-data feeds -->
  <rect x="536" y="44" width="240" height="58" rx="6" fill="#FFFFFF" stroke="#ACA69E" stroke-opacity="0.4"/>
  <text x="554" y="68" font-size="13" font-weight="600" fill="#251F17">Public-data feeds</text>
  <text x="554" y="86" font-size="10.5" fill="#635D53">n8n scrapers on cron, 4 sources live</text>
  <line x1="532" y1="73" x2="396" y2="73" stroke="#8C867D" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="464" y="64" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="8.5" fill="#635D53">ingest</text>

  <!-- External: enrichment -->
  <rect x="536" y="116" width="240" height="58" rx="6" fill="#FFFFFF" stroke="#ACA69E" stroke-opacity="0.4"/>
  <text x="554" y="140" font-size="13" font-weight="600" fill="#251F17">Apollo + Perplexity</text>
  <text x="554" y="158" font-size="10.5" fill="#635D53">contact data + AI website finder</text>
  <line x1="396" y1="145" x2="532" y2="145" stroke="#CE4257" stroke-width="1.5" marker-start="url(#a2)" marker-end="url(#a2)"/>
  <text x="464" y="136" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="8.5" fill="#CE4257" font-weight="600">on-demand only</text>

  <!-- External: Gmail -->
  <rect x="536" y="188" width="240" height="58" rx="6" fill="#FFFFFF" stroke="#ACA69E" stroke-opacity="0.4"/>
  <text x="554" y="212" font-size="13" font-weight="600" fill="#251F17">Gmail</text>
  <text x="554" y="230" font-size="10.5" fill="#635D53">threaded sends &#183; reply scan every 15 min</text>
  <line x1="396" y1="217" x2="532" y2="217" stroke="#8C867D" stroke-width="1.5" marker-start="url(#a2)" marker-end="url(#a2)"/>
  <text x="464" y="208" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="8.5" fill="#635D53">send &#183; scan</text>

  <!-- External: Telegram -->
  <rect x="536" y="260" width="240" height="58" rx="6" fill="#FFFFFF" stroke="#ACA69E" stroke-opacity="0.4"/>
  <text x="554" y="284" font-size="13" font-weight="600" fill="#251F17">Telegram</text>
  <text x="554" y="302" font-size="10.5" fill="#635D53">7am brief &#183; randomized evening debrief</text>
  <line x1="396" y1="289" x2="532" y2="289" stroke="#8C867D" stroke-width="1.5" marker-start="url(#a2)" marker-end="url(#a2)"/>
  <text x="464" y="280" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="8.5" fill="#635D53">brief &#183; debrief</text>

  <!-- External: Sheet mirror -->
  <rect x="536" y="332" width="240" height="58" rx="6" fill="#FFFFFF" stroke="#ACA69E" stroke-opacity="0.4"/>
  <text x="554" y="356" font-size="13" font-weight="600" fill="#251F17">Google Sheet mirror</text>
  <text x="554" y="374" font-size="10.5" fill="#635D53">validated dropdowns, self-calc dashboard</text>
  <line x1="396" y1="361" x2="532" y2="361" stroke="#8C867D" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="464" y="352" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="8.5" fill="#635D53">mirror</text>

  <!-- Employer CRM (manual) -->
  <rect x="536" y="408" width="240" height="46" rx="6" fill="none" stroke="#ACA69E" stroke-dasharray="5 4"/>
  <text x="554" y="428" font-size="12.5" font-weight="600" fill="#251F17">Employer CRM</text>
  <text x="554" y="444" font-size="10" fill="#635D53">weekly push: human only, by design</text>
  <line x1="656" y1="390" x2="656" y2="404" stroke="#8C867D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a2)"/>
</svg>
