<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Custom order lifecycle</title>
  <desc id="desc">The six-step lifecycle from selecting teeth to a paid, fulfillment-ready order.</desc>
  <rect width="1200" height="260" fill="#F8F5EF"/>
  <path d="M170 130H220M370 130H420M570 130H620M770 130H820M970 130H1020" stroke="#9A9388" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M208 122L220 130L208 138M408 122L420 130L408 138M608 122L620 130L608 138M808 122L820 130L808 138M1008 122L1020 130L1008 138" stroke="#9A9388" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#211F1B">
    <rect x="28" y="72" width="142" height="116" fill="#EFE9DF" stroke="#BDB5A9" stroke-width="2"/>
    <text x="48" y="112" font-size="18" font-weight="700">Select</text><text x="48" y="136" font-size="18" font-weight="700">teeth</text><text x="48" y="164" font-size="13" fill="#6B665F">presets or custom</text>
    <rect x="228" y="72" width="142" height="116" fill="#F2E4DD" stroke="#C7472F" stroke-width="2"/>
    <text x="248" y="112" font-size="18" font-weight="700">Choose</text><text x="248" y="136" font-size="18" font-weight="700">materials</text><text x="248" y="164" font-size="13" fill="#6B665F">metal, style, stones</text>
    <rect x="428" y="72" width="142" height="116" fill="#E7EEF0" stroke="#A8B8BD" stroke-width="2"/>
    <text x="448" y="112" font-size="18" font-weight="700">Calculate</text><text x="448" y="136" font-size="18" font-weight="700">price</text><text x="448" y="164" font-size="13" fill="#6B665F">rules and availability</text>
    <rect x="628" y="72" width="142" height="116" fill="#E7E9DF" stroke="#A8AD98" stroke-width="2"/>
    <text x="648" y="112" font-size="18" font-weight="700">Review</text><text x="648" y="136" font-size="18" font-weight="700">order</text><text x="648" y="164" font-size="13" fill="#6B665F">build instructions</text>
    <rect x="828" y="72" width="142" height="116" fill="#EFE9DF" stroke="#BDB5A9" stroke-width="2"/>
    <text x="848" y="112" font-size="18" font-weight="700">Pay</text><text x="848" y="136" font-size="18" font-weight="700">securely</text><text x="848" y="164" font-size="13" fill="#6B665F">Stripe checkout</text>
    <rect x="1028" y="72" width="142" height="116" fill="#F2E4DD" stroke="#C7472F" stroke-width="2"/>
    <text x="1048" y="112" font-size="18" font-weight="700">Build</text><text x="1048" y="136" font-size="18" font-weight="700">from data</text><text x="1048" y="164" font-size="13" fill="#6B665F">fulfillment record</text>
  </g>
</svg>
