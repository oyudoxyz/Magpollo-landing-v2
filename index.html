<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/magpollo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->

    <!-- Fonts: Plus Jakarta Sans for prose and UI, Cormorant Garamond for the hero, JetBrains Mono
         for kickers and figures. Loaded without blocking the first paint: the page renders in the
         fallback stack and swaps when the fonts arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=JetBrains+Mono:wght@400;600&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=JetBrains+Mono:wght@400;600&display=swap"></noscript>

    <meta name="theme-color" content="#DFD8CE">
    <meta name="color-scheme" content="light">

    <!-- Paper and ink before the stylesheet arrives, so nothing flashes white.
         Mirrors --bg and --fg in src/index.css. -->
    <style>
      html, body { background-color: #DFD8CE; color: #251F17; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
