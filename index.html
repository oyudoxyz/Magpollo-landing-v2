<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magpollo — Product Systems Studio</title>
    <meta name="description" content="For owner-run businesses and practices. We diagnose one important workflow, then design and ship a focused software system around the way your firm actually operates.">
    <meta name="keywords" content="product systems studio, internal software, workflow automation, owner-led firms, client development system, custom internal tools">

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Plus Jakarta Sans for everything, Cormorant Garamond for the big headlines -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap">

    <!-- Social media meta tags -->
    <meta property="og:title" content="Magpollo — Product Systems Studio">
    <meta property="og:description" content="A system should be handling that. We build the part your software does not cover, around how you actually work.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://magpollo.com">
    <meta property="og:image" content="https://magpollo.com/assets/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Magpollo — Product Systems Studio">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Theme color for browser UI -->
    <meta name="theme-color" content="#DFD8CE">
    <meta name="color-scheme" content="light">

    <style>
      /* Applied immediately to avoid a flash before the app mounts */
      html, body {
        background-color: #DFD8CE;
        margin: 0;
      }

      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #251F17;
      }

      .preload-spinner {
        position: fixed;
        inset: 0;
        background: #DFD8CE;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s, visibility 0.3s;
      }

      /* A hairline that draws itself, matching the rules used across the site */
      .preload-rule {
        width: 120px;
        height: 1px;
        background: #ACA69E;
        position: relative;
        overflow: hidden;
      }

      .preload-rule::after {
        content: '';
        position: absolute;
        inset: 0;
        background: #251F17;
        transform-origin: left;
        animation: sweep 1.2s ease-in-out infinite;
      }

      @keyframes sweep {
        0%   { transform: scaleX(0); transform-origin: left; }
        50%  { transform: scaleX(1); transform-origin: left; }
        51%  { transform: scaleX(1); transform-origin: right; }
        100% { transform: scaleX(0); transform-origin: right; }
      }

      @media (prefers-reduced-motion) {
        .preload-rule::after { animation: none; transform: scaleX(0.4); }
      }

      .js-loaded .preload-spinner {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Loading indicator -->
    <div class="preload-spinner">
      <div class="preload-rule"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Remove loading indicator when app is loaded
      window.addEventListener('load', function() {
        document.body.classList.add('js-loaded');
      });
    </script>
  </body>
</html>
